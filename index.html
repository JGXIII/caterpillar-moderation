<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Caterpillar Moderation</title>
<!--
  ── WHY CARDS AND NOT A TABLE ──
  This was a generic dump of every database column into one wide table. On a
  phone it needed scrolling in both directions at once: sideways to reach the
  macros, then back up to the header to remember whether the column you were
  looking at was fat or fibre, then back down to find the row again. Deciding
  "is this product right?" took a dozen gestures.

  Every row is now a self-contained card. Each value carries its own label, so
  nothing depends on a header that has scrolled off. Nothing scrolls
  horizontally, ever. The photos the values were read from sit at the top of
  the card, because a nutrition panel is checkable in a glance and a table of
  numbers is not.

  ── WHY THE BASIS TOGGLE ──
  Corrections are STORED per 100 g (that's the app's internal basis) but the
  serving size comes across as-is. The dashboard showed both side by side with
  no labels, so a 54 g serving sat next to per-100 g macros and read as one
  set of figures for that serving — which is wrong by whatever factor the
  serving happens to be. The basis is now stated on every card, and the
  toggle converts the whole card at once so you can read it in the same terms
  the packet uses.
-->
<style>
  :root {
    --green:#2e7d32; --green-lt:#9ccc65; --amber:#ffbf00;
    --bg:#0a1f0d; --card:#132b17; --line:#20422a; --dim:#8aa891;
    --radius:14px;
  }
  * { box-sizing:border-box; -webkit-text-size-adjust:100%; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:#eee;
         font:15px/1.45 -apple-system,system-ui,sans-serif; }

  header { position:sticky; top:0; z-index:20; padding:10px 14px;
           background:var(--card); border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; color:var(--green-lt); flex:1;
              white-space:nowrap; }
  main { padding:12px; max-width:760px; margin:0 auto; }

  /* Tabs scroll sideways on their own; the PAGE never does. */
  .tabs { display:flex; gap:6px; overflow-x:auto; padding:10px 12px 2px;
          max-width:760px; margin:0 auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { flex:0 0 auto; background:none; border:1px solid #345;
    color:#bbb; padding:8px 14px; border-radius:18px; cursor:pointer;
    font-size:14px; white-space:nowrap; }
  .tabs button.active { background:var(--green); color:#fff;
    border-color:var(--green); font-weight:600; }
  .tabs .count { opacity:.75; font-size:12px; margin-left:4px; }

  .card { background:var(--card); border:1px solid var(--line);
          border-radius:var(--radius); padding:14px; margin-bottom:14px; }
  .card h2 { margin:0; font-size:17px; line-height:1.25; }
  .sub { color:var(--dim); font-size:13px; margin-top:2px;
         overflow-wrap:anywhere; }

  /* Photos: the whole point of the rebuild. Tap to see full size. */
  .shots { display:flex; gap:8px; overflow-x:auto; margin:-2px 0 12px;
           padding-bottom:4px; }
  .shots img { height:120px; width:auto; border-radius:10px;
               border:1px solid var(--line); cursor:zoom-in; flex:0 0 auto;
               background:#000; }
  .noshots { color:var(--dim); font-size:12px; font-style:italic;
             margin-bottom:10px; }

  /* Every field labelled, so nothing depends on a header row. */
  .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
            gap:8px; margin:12px 0; }
  .f { background:#0e2412; border:1px solid var(--line); border-radius:10px;
       padding:7px 9px; min-width:0; }
  .f label { display:block; font-size:10.5px; letter-spacing:.06em;
             text-transform:uppercase; color:var(--green-lt); margin-bottom:3px; }
  .f input { width:100%; background:none; border:none; color:#fff;
             font-size:16px; font-weight:600; padding:0; min-width:0; }
  .f input:focus { outline:none; }
  .f .ro { font-size:15px; font-weight:600; overflow-wrap:anywhere; }
  .f.full { grid-column:1/-1; }

  .basis { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
           margin:10px 0 2px; font-size:12.5px; color:var(--dim); }
  .basis .seg { display:inline-flex; border:1px solid #345; border-radius:9px;
                overflow:hidden; }
  .basis .seg button { background:none; border:none; color:#bbb;
    padding:6px 11px; font-size:12.5px; cursor:pointer; }
  .basis .seg button.on { background:var(--green); color:#fff; font-weight:600; }

  .acts { display:flex; gap:8px; margin-top:12px; }
  .acts button { flex:1; border:none; border-radius:10px; padding:12px 8px;
    color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .approve { background:var(--green); } .reject { background:#8b3a3a; }
  .del { background:#33404a; flex:0 0 56px !important; }

  .badge { display:inline-block; font-size:11px; padding:3px 9px;
           border-radius:11px; background:#20422a; color:var(--green-lt);
           margin:2px 4px 0 0; white-space:nowrap; }
  .badge.warn { background:#5a4a10; color:#ffd75e; }
  .badge.bad  { background:#5a1d1d; color:#ffb4b4; }
  .status-pending  { color:var(--amber); }
  .status-approved { color:#81c784; }
  /* A purged deletion request. Without this the badge rendered unstyled,
     which read as "something went wrong" for the one status that means the
     opposite. */
  .status-done     { color:#81c784; }
  .status-rejected { color:#e57373; }

  #login { max-width:340px; margin:100px auto; background:var(--card);
           padding:26px; border-radius:16px; }
  #login input { width:100%; margin:6px 0; padding:12px; border-radius:8px;
                 border:1px solid #345; background:#0e2412; color:#fff;
                 font-size:16px; }
  #login button { width:100%; padding:13px; margin-top:10px; border:none;
                  border-radius:8px; background:var(--green); color:#fff;
                  font-weight:700; font-size:16px; cursor:pointer; }
  #msg { color:var(--amber); font-size:13px; }
  .pill { font-size:11px; padding:3px 9px; border-radius:10px; background:#234;
          color:var(--dim); }
  .csv { background:none; border:1px solid #567; color:var(--green-lt);
         border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
  .empty { color:var(--green-lt); text-align:center; padding:40px 10px; }
  .note { color:#789; font-size:12px; margin:6px 2px 20px; }

  /* ── Multi-select ──
     One-by-one was the only way to clear a queue, and a queue can arrive
     hundreds long. The checkbox sits in the card's top-right so it is
     reachable with a thumb and never overlaps the title. */
  .card { position:relative; }
  .card.picked { border-color:var(--green-lt);
                 box-shadow:inset 0 0 0 1px var(--green-lt); }
  .pick { position:absolute; top:10px; right:10px; width:26px; height:26px;
          accent-color:var(--green-lt); cursor:pointer; z-index:2; }
  .card h2 { padding-right:34px; }

  /* The bulk bar only exists when something is selected, so it never takes
     space from the queue it is acting on. */
  .bulk { position:sticky; bottom:0; z-index:30; display:flex; gap:8px;
          align-items:center; flex-wrap:wrap; padding:10px 12px;
          margin:0 -12px -12px; background:var(--card);
          border-top:1px solid var(--green-lt); }
  .bulk .n { font-weight:700; color:var(--green-lt); font-size:14px;
             margin-right:auto; }
  .bulk button { border:none; border-radius:9px; padding:10px 13px; color:#fff;
                 font-size:14px; font-weight:600; cursor:pointer; }
  .bulk .clear { background:#33404a; }
  .selbar { display:flex; gap:8px; align-items:center; margin:0 2px 12px;
            font-size:13px; color:var(--dim); flex-wrap:wrap; }
  .selbar button { background:none; border:1px solid #345; color:var(--green-lt);
                   border-radius:8px; padding:6px 11px; cursor:pointer;
                   font-size:13px; }

  /* Full-size photo viewer */
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:50;
              display:none; align-items:center; justify-content:center;
              padding:16px; cursor:zoom-out; }
  #lightbox img { max-width:100%; max-height:100%; border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>🐛 Caterpillar Moderation</h1>
  <span id="refreshed" class="pill"></span>
  <button class="csv" onclick="exportCSV()">CSV</button>
  <button class="csv" onclick="logout()" id="logoutBtn" style="display:none">Log out</button>
</header>

<div id="login">
  <h2 style="margin-top:0">Sign in</h2>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="login()">Sign in</button>
  <p id="msg"></p>
</div>

<div id="app" style="display:none">
  <div class="tabs" id="tabs"></div>
  <main><div id="content"></div></main>
</div>

<div id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" alt=""></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://jkxxqojfualdmsvyaprz.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpreHhxb2pmdWFsZG1zdnlhcHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MDg2NDcsImV4cCI6MjA5MTk4NDY0N30.xN4-oo8YagLnrOjD0IhliEN_2GdYYTLhpQzHCkrVnU0";
const sb = createClient(SUPABASE_URL, ANON_KEY);

const TABS = [
  { id:"moderation_submissions",    label:"Corrections" },
  { id:"moderation_ai_candidates",  label:"AI Candidates" },
  { id:"verified_foods",            label:"Verified Foods" },
  { id:"moderation_food_requests",  label:"Requests" },
  { id:"account_deletion_requests", label:"Deletions" },
];

let currentTab = TABS[0].id;
let rows = [];
let reachById = {};
// Per-card display basis: "100" (as stored) or "serving". Keyed by row id so
// flipping one card doesn't disturb the others.
const basisById = {};

window.login = async () => {
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
  });
  document.getElementById("msg").textContent = error ? error.message : "";
  if (!error) showApp();
};
window.logout = async () => { await sb.auth.signOut(); location.reload(); };

function buildTabs() {
  document.getElementById("tabs").innerHTML = TABS.map((t) =>
    `<button data-tab="${t.id}" class="${t.id === currentTab ? "active" : ""}">`
    + `${t.label}<span class="count" id="count-${t.id}"></span></button>`).join("");
  document.querySelectorAll(".tabs button").forEach((b) =>
    b.addEventListener("click", () => {
      currentTab = b.dataset.tab;
      // Ids belong to ONE table. Carrying a selection across tabs would aim a
      // bulk delete at rows that aren't there — silently doing nothing, or
      // worse, matching something unrelated.
      selected.clear();
      buildTabs();
      load();
    }));
}

async function showApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("logoutBtn").style.display = "inline-block";
  buildTabs();
  await load();
  await refreshCounts();
  setInterval(load, 60 * 1000);
  setInterval(refreshCounts, 5 * 60 * 1000);
}

// Pending counts on the tabs, so you can see where the work is without
// opening every tab to find out it's empty.
async function refreshCounts() {
  for (const t of TABS) {
    try {
      const { count } = await sb.from(t.id)
        .select("id", { count: "exact", head: true });
      const el = document.getElementById(`count-${t.id}`);
      if (el) el.textContent = count ? ` ${count}` : "";
    } catch { /* a missing table just shows no count */ }
  }
}

// A second client on the ANON key. moderation_ai_candidates grants anon
// SELECT, so if anon sees rows the signed-in session cannot, that is
// definitively an RLS problem — not an empty queue. This exists because that
// exact failure hid for two weeks behind a cheerful "Nothing pending".
const probe = createClient(SUPABASE_URL, ANON_KEY);

async function permissionsLookBroken() {
  try {
    const { count, error } = await probe
      .from("moderation_ai_candidates")
      .select("id", { count: "exact", head: true });
    if (error || !count) return false;
    const { count: mine } = await sb
      .from("moderation_ai_candidates")
      .select("id", { count: "exact", head: true });
    return (mine ?? 0) === 0;
  } catch { return false; }
}

/// Columns to fetch for the list.
///
/// ── WHY VERIFIED FOODS IS SPELLED OUT ──
/// `select("*")` pulled `photos_b64` — up to three base64 JPEGs per row — for
/// every row on every load, and `load()` runs on a 60-second timer. At 120
/// rows that is tens of megabytes a minute for as long as the tab is open,
/// against a 5 GB monthly egress allowance. It got worse linearly as the
/// table grew, and none of it was being looked at: most verified rows have no
/// photo, and a verified row's numbers are read-only now anyway.
///
/// Corrections keep their photos eagerly, because that tab's entire job is
/// judging proposed numbers against the panel they were read from. Verified
/// Foods loads a photo only when asked — see `showPhotos`.
///
/// Spelled out rather than excluded because PostgREST has no "all but this"
/// syntax. A column added to verified_foods later has to be added here too;
/// that is the cost of not shipping megabytes nobody reads.
const VERIFIED_LIST_COLUMNS = [
  "id", "barcode", "brand", "product_name", "flavour", "serving_size_g",
  "calories", "protein_g", "carbs_g", "fat_g", "fibre_g", "source",
  "confidence", "verification_count", "trust_level", "flagged_for_review",
  "verification_basis", "name_review", "conflict_note",
  "created_at", "updated_at",
].join(",");

/// Corrections carry the same base64 photos, and there are more of them.
///
/// ── THE STATEMENT TIMEOUT ──
/// `select("*")` over 110 correction rows, each with up to three base64
/// JPEGs, is tens of megabytes assembled inside one statement — and it ran
/// again every 60 seconds. Postgres cancelled it, and because the reply was
/// unguarded the error landed on whichever tab was open by then.
///
/// Same treatment as Verified Foods: fetch the fields the card needs, load a
/// row's photos when asked. It costs a tap per row, which is a real loss on
/// the tab whose whole job is checking numbers against a panel — but the tab
/// was timing out, and a photo you have to tap for beats a page that won't
/// load.
/// ── "fibre" IS NOT A COLUMN HERE, AND NEVER WAS ──
/// This list asked for one, PostgREST rejected the whole select, and the
/// Corrections tab showed "Couldn't load — column
/// moderation_submissions.fibre does not exist". One wrong name took the
/// entire tab down, because a select is all-or-nothing.
///
/// The name was borrowed from moderation_ai_candidates, which DOES have a
/// fibre column. Submissions carry fibre inside `extras` alongside sugar
/// and saturated fat — see ModerationSyncService, which has never sent a
/// top-level fibre for this table.
const SUBMISSION_LIST_COLUMNS = [
  "id", "barcode", "food_name", "brand", "kind", "country", "status",
  "calories", "protein", "carbs", "fat", "serving_size",
  "extras", "created_at",
].join(",");

function listColumns() {
  switch (currentTab) {
    case "verified_foods":          return VERIFIED_LIST_COLUMNS;
    case "moderation_submissions":  return SUBMISSION_LIST_COLUMNS;
    default:                        return "*";
  }
}

/// How many rows to ask for.
///
/// 500 was a "surely that's enough" number chosen when every row was small.
/// The queues are the wrong shape for it: a moderator works through the top
/// of the list, and asking for five hundred rows to show the first ten is
/// what turned a slow query into a cancelled one.
function pageSize() {
  return 200;
}

/// Photos fetched on demand, kept so the 60s refresh doesn't discard them.
const photosById = {};

window.showPhotos = async (id) => {
  const slot = document.getElementById(`shots-${id}`);
  if (slot) slot.innerHTML = `<p class="noshots">Loading…</p>`;
  // Whichever table this row came from — both carry photos_b64, and both now
  // omit it from the list query.
  const { data, error } = await sb.from(currentTab)
    .select("photos_b64,label_photo_b64").eq("id", id).single();
  if (error) { if (slot) slot.innerHTML = `<p class="noshots">${esc(error.message)}</p>`; return; }
  photosById[id] = photosOf(data ?? {});
  render();
};

/// Increments on every load. A reply whose token is stale is discarded.
///
/// ── WHY THE ERROR APPEARED ON THE WRONG TAB ──
/// `load()` awaited, then wrote to #content unconditionally. Corrections is
/// the slow query — 110 rows, each with base64 photos — so switching away from
/// it while it was still running meant its result (often a statement timeout)
/// landed on whatever tab you had moved to. Hence "things load and then
/// disappear to be replaced by this message", on a tab whose own query was
/// fine.
///
/// Also covers the 60-second auto-refresh overlapping a manual tab change.
let loadToken = 0;

async function load() {
  const token = ++loadToken;
  const forTab = currentTab;
  /// True when this reply is still the one being waited for.
  const current = () => token === loadToken && forTab === currentTab;
  // AI candidates sort by CONFIDENCE, highest first. Scored against 27 real
  // decisions, ai_confidence turned out not to predict approval well enough
  // to auto-approve on (33-44% error at every threshold from 0.6 to 0.9) —
  // but it is still the best available ordering, so review time goes to the
  // most likely keepers first. selection_count breaks ties: a candidate a
  // user actually picked is the strongest signal there is.
  let q = sb.from(currentTab).select(listColumns());
  q = currentTab === "moderation_ai_candidates"
    ? q.order("ai_confidence", { ascending: false })
       .order("selection_count", { ascending: false })
    : q.order("created_at", { ascending: false });
  const { data, error } = await q.limit(pageSize());
  if (!current()) return;              // the user has moved on
  if (error) {
    document.getElementById("content").innerHTML =
      `<div class="card"><h2>Couldn't load</h2><p class="sub">${esc(error.message)}</p>`
      + `<p class="sub">Tab: ${esc(forTab)}</p></div>`;
    return;
  }
  rows = data ?? [];

  reachById = {};
  if (currentTab === "moderation_ai_candidates") {
    const { data: reach } = await sb.from("moderation_candidate_reach").select("*");
    if (!current()) return;
    for (const r of reach ?? []) reachById[r.candidate_id] = r;
  }

  // Drop selections for rows that no longer exist — load() runs on a timer,
  // and a stale id in the set would show a count for something that isn't
  // on screen.
  const present = new Set(rows.map((r) => String(r.id)));
  for (const id of [...selected]) if (!present.has(id)) selected.delete(id);

  document.getElementById("refreshed").textContent =
    `${rows.length} · ${new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })}`;
  render();
}

// ── helpers ───────────────────────────────────────────────────────────────
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const num = (v) => (v === null || v === undefined || v === "" ? null : Number(v));
const fmt = (v, dp = 1) => {
  const n = num(v);
  if (n === null || Number.isNaN(n)) return "";
  return Number.isInteger(n) ? String(n) : n.toFixed(dp).replace(/\.0$/, "");
};

const numericCols = new Set(["calories", "protein", "carbs", "fat", "fibre",
  "serving_size", "caffeine_mg", "ai_confidence", "times_suggested",
  "selection_count", "request_count", "displayed_calories", "serving_size_g",
  "protein_g", "carbs_g", "fat_g", "fibre_g"]);

/// Photos for a row, oldest schema first: `photos_b64` is the lineup,
/// `label_photo_b64` the single legacy shot.
function photosOf(r) {
  const many = Array.isArray(r.photos_b64) ? r.photos_b64 : [];
  if (many.length) return many;
  return r.label_photo_b64 ? [r.label_photo_b64] : [];
}

function shotsHTML(r, expected) {
  // The list no longer carries photos for the heavy tabs; they load per row.
  if (photosById[r.id] === undefined && !photosOf(r).length && expected) {
    return `<div id="shots-${esc(r.id)}">`
      + `<button class="csv" onclick="showPhotos('${esc(r.id)}')">`
      + `📷 Label photo</button></div>`;
  }
  const p = photosById[r.id] ?? photosOf(r);
  if (!p.length) {
    return expected
      ? `<div id="shots-${esc(r.id)}"><p class="noshots">No photo attached — `
        + `this one was typed in, not scanned.</p></div>`
      : "";
  }
  return `<div class="shots">` + p.map((b64) =>
    `<img src="data:image/jpeg;base64,${b64}" alt="submitted photo" `
    + `onclick="zoom(this.src)">`).join("") + `</div>`;
}

/// Verified Foods photos: a button until you want them.
///
/// The label shot matters when you are deciding whether a record is sound
/// enough to keep — which is occasional. Shipping every photo on every
/// refresh to serve that is what made the tab expensive.
function verifiedShotsHTML(r) {
  const loaded = photosById[r.id];
  if (loaded === undefined) {
    return `<div id="shots-${esc(r.id)}">`
      + `<button class="csv" onclick="showPhotos('${esc(r.id)}')">`
      + `📷 Label photo</button></div>`;
  }
  if (!loaded.length) {
    return `<div id="shots-${esc(r.id)}">`
      + `<p class="noshots">No photo stored for this record.</p></div>`;
  }
  return `<div id="shots-${esc(r.id)}" class="shots">` + loaded.map((b64) =>
    `<img src="data:image/jpeg;base64,${b64}" alt="label photo" `
    + `onclick="zoom(this.src)">`).join("") + `</div>`;
}

window.zoom = (src) => {
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").style.display = "flex";
};

/// One labelled field. `col` makes it editable; omit it for read-only.
function field(r, label, col, value, opts = {}) {
  const cls = opts.full ? "f full" : "f";
  if (!col) {
    const v = value === "" || value === null || value === undefined ? "—" : value;
    return `<div class="${cls}"><label>${esc(label)}</label>`
      + `<div class="ro">${esc(v)}</div></div>`;
  }
  // data-orig is what was rendered. On save, a field still holding that value
  // is left alone rather than converted back — displaying per-serving rounds
  // to 1dp, and round-tripping an untouched 3.8 through ×0.16 and ÷0.16 would
  // silently rewrite it as 3.75. Only edits should change stored data.
  return `<div class="${cls}"><label>${esc(label)}</label>`
    + `<input data-id="${esc(r.id)}" data-col="${esc(col)}" `
    + `${opts.factor ? `data-factor="${opts.factor}"` : ""} `
    + `data-orig="${esc(value ?? "")}" `
    + `${numericCols.has(col) ? 'inputmode="decimal"' : ""} `
    + `value="${esc(value ?? "")}"></div>`;
}

// ── basis ─────────────────────────────────────────────────────────────────
// Corrections arrive with macros PER 100 g and a real serving size alongside
// them. Showing both unlabelled made the macros look like they were for that
// serving. The card states which basis it is in and converts on demand;
// whatever you type is converted back to per-100 g on save, because that is
// what the app stores and reads.
function servingOf(r) {
  const s = num(r.serving_size) ?? num(r.serving_size_g);
  return s && s > 0 ? s : null;
}

function basisHTML(r) {
  const serving = servingOf(r);
  if (!serving) {
    return `<div class="basis">Values are <strong>per 100 g/ml</strong>`
      + ` — no serving size on this submission.</div>`;
  }
  const mode = basisById[r.id] ?? "100";
  return `<div class="basis">Showing
    <span class="seg">
      <button class="${mode === "100" ? "on" : ""}" onclick="setBasis('${esc(r.id)}','100')">per 100 g</button>
      <button class="${mode === "serving" ? "on" : ""}" onclick="setBasis('${esc(r.id)}','serving')">per serving (${fmt(serving)} g)</button>
    </span>
    ${mode === "serving" ? "converted for display — saved back per 100 g" : "as stored"}
  </div>`;
}

window.setBasis = (id, mode) => { basisById[id] = mode; render(); };

/// Multiplier from stored (per-100 g) values to what's on screen.
function displayFactor(r) {
  const serving = servingOf(r);
  if (!serving || (basisById[r.id] ?? "100") === "100") return 1;
  return serving / 100;
}

// ── cards ─────────────────────────────────────────────────────────────────
function titleOf(r) {
  const name = r.food_name || r.name || r.product_name || r.email
    || r.barcode || "(unnamed)";
  return r.flavour ? `${name} — ${r.flavour}` : name;
}

function macroFields(r, f) {
  // f is the display factor; values are stored per 100 g.
  const scale = (v) => {
    const n = num(v);
    return n === null ? "" : fmt(n * f);
  };
  const cals = r.calories !== undefined ? "calories" : null;
  const prot = r.protein !== undefined ? "protein" : "protein_g";
  const carb = r.carbs   !== undefined ? "carbs"   : "carbs_g";
  const fat  = r.fat     !== undefined ? "fat"     : "fat_g";
  const fib  = r.fibre   !== undefined ? "fibre"
             : r.fibre_g !== undefined ? "fibre_g" : null;
  // A submission's fibre lives in `extras`, not in a column of its own. It
  // is shown read-only: `field` writes back to the column it is given, and
  // there is no column — editing it would have to patch one key inside a
  // jsonb blob, which is a different save path than this one.
  const extrasFibre = fib === null ? num(r.extras?.fibre_g) : null;
  return [
    field(r, "Calories", cals ?? "calories", scale(r[cals ?? "calories"]), { factor:f }),
    field(r, "Protein g", prot, scale(r[prot]), { factor:f }),
    field(r, "Carbs g",   carb, scale(r[carb]), { factor:f }),
    field(r, "Fat g",     fat,  scale(r[fat]),  { factor:f }),
    fib === null
      ? field(r, "Fibre g", null, extrasFibre === null ? "" : scale(extrasFibre))
      : field(r, "Fibre g", fib, scale(r[fib]), { factor:f }),
  ].join("");
}

/// Everything in the row's `micros` blob, editable.
///
/// Written back through the same save path as the macros: `data-col` carries
/// `micros.<id>`, and `saveRow` folds those into one jsonb patch so a single
/// key can be corrected without rewriting the whole object.
function microsHTML(r) {
  const m = r.micros && typeof r.micros === "object" ? r.micros : {};
  const ids = Object.keys(m).sort();
  if (!ids.length) {
    return `<p class="note">No micronutrients recorded on this row.</p>`;
  }
  return `<div class="fields">`
    + ids.map((id) =>
        field(r, id, `micros.${id}`, fmt(m[id]))).join("")
    + `</div>`;
}

function actionsHTML(r) {
  return `<div class="acts">
    <button class="approve" onclick="setStatus('${esc(r.id)}','approved')">✓ Approve</button>
    <button class="reject"  onclick="setStatus('${esc(r.id)}','rejected')">✗ Reject</button>
    <button class="del"     onclick="deleteRow('${esc(r.id)}')" title="Delete">🗑</button>
  </div>`;
}

function statusBadge(r) {
  const s = r.approval_status ?? r.status;
  if (!s) return "";
  return `<span class="badge status-${esc(s)}">${esc(s)}</span>`;
}

function cardHTML(r) {
  const f = displayFactor(r);
  const serving = servingOf(r);
  let body = "";

  switch (currentTab) {
    case "moderation_submissions": {
      body = shotsHTML(r, true)
        + `<h2>${esc(titleOf(r))}</h2>`
        + `<div class="sub">${esc(r.brand || "no brand")}`
        + (r.barcode ? ` · ${esc(r.barcode)}` : "")
        + ` · ${esc(r.kind || "submission")}${r.country ? " · " + esc(r.country) : ""}</div>`
        + `<div>${statusBadge(r)}</div>`
        + basisHTML(r)
        + `<div class="fields">`
        + field(r, "Name", "food_name", r.food_name, { full:true })
        + field(r, "Brand", "brand", r.brand)
        + field(r, "Serving g", "serving_size", fmt(r.serving_size))
        + macroFields(r, f)
        + extrasFields(r, f)
        + `</div>`
        + actionsHTML(r);
      break;
    }
    case "moderation_ai_candidates": {
      const conf = num(r.ai_confidence);
      const confClass = conf === null ? "" : conf >= 0.85 ? "" : conf >= 0.7 ? "warn" : "bad";
      body = `<h2>${esc(titleOf(r))}</h2>`
        + `<div class="sub">${esc(r.brand || "no brand")}`
        + (r.barcode ? ` · ${esc(r.barcode)}` : "")
        + (r.source_query ? ` · searched “${esc(r.source_query)}”` : "") + `</div>`
        + `<div>${statusBadge(r)}`
        + (conf === null ? "" : `<span class="badge ${confClass}">confidence ${(conf * 100).toFixed(0)}%</span>`)
        + (r.selection_count ? `<span class="badge">picked ${r.selection_count}×</span>` : "")
        + (r.times_suggested ? `<span class="badge">shown ${r.times_suggested}×</span>` : "")
        + (r.approval_status === "approved" ? `<span class="badge">reach ${reachCell(r)}</span>` : "")
        + `</div>`
        + basisHTML(r)
        + `<div class="fields">`
        + field(r, "Name", "name", r.name, { full:true })
        + field(r, "Brand", "brand", r.brand)
        + field(r, "Serving g", "serving_size", fmt(r.serving_size))
        + macroFields(r, f)
        + field(r, "Caffeine mg", "caffeine_mg", fmt(num(r.caffeine_mg) * f))
        + `</div>`
        + actionsHTML(r);
      break;
    }
    case "verified_foods": {
      const trust = r.trust_level || "bronze";
      // No panel behind these numbers: "estimate" (no published data either)
      // or "reference" (published data, still not a transcription).
      const estimated = r.verification_basis === "estimate"
        || r.verification_basis === "reference";
      body = verifiedShotsHTML(r)
        + `<h2>${esc(titleOf(r))}</h2>`
        + `<div class="sub">${esc(r.brand || "no brand")}`
        + (r.barcode ? ` · ${esc(r.barcode)}` : "") + `</div>`
        + `<div><span class="badge">${esc(trust)}</span>`
        + `<span class="badge">confirmed ${r.verification_count ?? 1}×</span>`
        + (estimated
            ? `<span class="badge warn">nutrition not measured`
              + ` · ${esc(r.verification_basis)}</span>`
            : r.verification_basis
              ? `<span class="badge">verified by ${esc(r.verification_basis)}</span>`
              : "")
        + (r.flagged_for_review ? `<span class="badge bad">conflict flagged</span>` : "")
        // ── A NAME THAT CLASSIFIES INSTEAD OF NAMING ──
        // "muffin" for an English muffin. The numbers on these rows are
        // usually right — they came off a real panel — so the row is stored
        // and flagged rather than refused. What it needs is a human to type
        // the name that's printed on the pack. Rename the row and the flag
        // clears on save; a later barcode-matched scan with a real name
        // clears it without anyone doing anything.
        + (r.name_review ? `<span class="badge bad">name needs review</span>` : "")
        + `</div>`
        + (estimated
            ? `<div class="basis"><strong>These numbers were never read off a
                 panel.</strong> The barcode proves what the product is; the
                 nutrition is ${r.verification_basis === "reference"
                   ? "a reference value for the generic food"
                   : "a category estimate — no published data exists for it"}.
                 Users cannot edit these; you can. A photographed panel will
                 replace them outright.</div>`
            : "")
        + (r.name_review
            ? `<div class="basis"><strong>This name is a category, not a product.</strong>
                 Nutrition is trusted; the name is not, so the row stays bronze
                 until it has a real one. Rename it below.</div>`
            : "")
        + `<div class="basis">Values are <strong>per serving`
        + (serving ? ` (${fmt(serving)} g)` : "") + `</strong> — as printed on the label.</div>`
        + `<div class="fields">`
        // ── THREE FIELDS EDITABLE, THE REST READ-ONLY ──
        // Everything here was editable, which was the wrong shape for what
        // this table IS. These rows are the app's highest-trust record: the
        // nutrition came off a photographed label through the verified-read
        // flow, which exists precisely so that numbers are never typed. A
        // dashboard that invites someone to retype them by hand undoes that.
        //
        // What genuinely does need fixing by hand is the IDENTITY of the row —
        // the name and brand a crowd-sourced database got wrong or left blank,
        // and the serving size, which is the one measurement a label photo
        // routinely fails to capture.
        //
        // A row whose NUMBERS are wrong is not an edit, it's a bad record:
        // delete it and let the next scan re-verify from the label.
        + field(r, "Product name", "product_name", r.product_name)
        + field(r, "Brand", "brand", r.brand)
        + field(r, "Serving", "serving_size_g", fmt(r.serving_size_g))
        + field(r, "Barcode", null, r.barcode || "—")
        // ── THE MODERATOR IS THE EXCEPTION, ON EVERY ROW ──
        // Nutrition used to be read-only on a TRANSCRIBED row, on the
        // reasoning that those numbers came off a photographed panel through
        // a flow built so they are never typed by hand. Estimates were open
        // because nobody measured them.
        //
        // That reasoning protects the wrong thing. The transcription flow can
        // and does get it wrong — a Warrior RAGE tub verified by barcode with
        // 0 across every macro, a Birds Eye pack with carbohydrate reading
        // protein's number — and when it does, the moderator is the ONE
        // person holding the actual packet. Locking the fields did not make
        // the numbers right; it made a wrong row unfixable, so the only
        // remedy left was deleting a correctly identified product.
        //
        // Users still never type these. The lock that matters is the one in
        // the app.
        + field(r, "Calories", "calories", fmt(r.calories))
        + field(r, "Protein g", "protein_g", fmt(r.protein_g))
        + field(r, "Carbs g", "carbs_g", fmt(r.carbs_g))
        + field(r, "Fat g", "fat_g", fmt(r.fat_g))
        + field(r, "Fibre g", "fibre_g", fmt(r.fibre_g))
        + `</div>`
        // ── AND WHAT THE ROW CARRIES BESIDES THE MACROS ──
        // `micros` holds everything else the read captured — sodium, sugar,
        // saturated fat, caffeine, the vitamins, and now taurine and guarana.
        // None of it was shown, so a moderator judging a row could see five
        // numbers out of twenty and had no way to tell a complete record from
        // a threadbare one.
        + microsHTML(r)
        + (r.conflict_note ? `<p class="note">${esc(r.conflict_note)}</p>` : "")
        + `<div class="acts">`
        + `<button class="ok" style="flex:1 !important" `
        + `onclick="saveRow('${esc(r.id)}')">Save changes</button>`
        + `<button class="del" onclick="deleteRow('${esc(r.id)}')" `
        + `title="Delete permanently">🗑</button>`
        + `</div>`;
      break;
    }
    case "moderation_food_requests": {
      body = `<h2>${esc(titleOf(r))}</h2>`
        + `<div class="sub">${esc(r.brand || "no brand")}`
        + (r.barcode ? ` · ${esc(r.barcode)}` : "") + `</div>`
        + `<div>${statusBadge(r)}`
        + `<span class="badge">asked for ${r.request_count ?? 1}×</span></div>`
        + actionsHTML(r);
      break;
    }
    default: {
      // Anything without a purpose-built card still shows every field,
      // labelled — never a horizontally scrolling table.
      body = `<h2>${esc(titleOf(r))}</h2><div class="fields">`
        + Object.keys(r).filter((c) => !["photos_b64", "label_photo_b64"].includes(c))
            .map((c) => field(r, c.replace(/_/g, " "), null, r[c])).join("")
        + `</div>` + actionsHTML(r);
    }
  }
  const picked = selected.has(String(r.id));
  return `<div class="card${picked ? " picked" : ""}" data-row="${esc(r.id)}">`
    + `<input type="checkbox" class="pick" ${picked ? "checked" : ""} `
    + `onchange="togglePick('${esc(r.id)}')" `
    + `aria-label="Select this row">`
    + `${body}</div>`;
}

/// Fibre/sugar/sat fat/sodium the user typed into a correction, stored in a
/// jsonb `extras` map. Read-only here — they ride along with the approval.
function extrasFields(r, f) {
  const e = r.extras;
  if (!e || typeof e !== "object") return "";
  return Object.entries(e).map(([k, v]) =>
    field(r, k.replace(/_/g, " "), null, fmt(num(v) * f))).join("");
}

function render() {
  const el = document.getElementById("content");
  if (!rows.length) {
    el.innerHTML = currentTab === "verified_foods"
      ? `<p class="empty">No verified foods yet — they appear as users scan nutrition labels.</p>`
      : `<p class="empty">Nothing pending — go touch grass 🌿</p>`;
    permissionsLookBroken().then((broken) => {
      if (!broken || rows.length) return;
      el.innerHTML =
        `<div class="card" style="background:#5a1d1d;border-color:#ff8a80;color:#ffcdd2">
         <h2>This dashboard cannot read the database.</h2>
         <p>The tables are NOT empty — an anonymous client can see rows your
         signed-in session cannot. The row-level security policies for the
         <code>authenticated</code> role are missing or wrong.</p>
         <p>A blocked SELECT returns an empty result rather than an error,
         which is why this looks like an empty queue.</p>
         <p>Fix: re-apply
         <code>supabase/migrations/20260801_moderation_dashboard_read.sql</code>
         with <code>supabase db push</code>.</p></div>`;
    });
    return;
  }
  // Rows no longer needing attention are hidden rather than deleted — see
  // `visibleRows`.
  const shown = visibleRows();
  const hidden = rows.length - shown.length;
  el.innerHTML = selectBarHTML(shown, hidden)
    + shown.map(cardHTML).join("")
    + tabNote()
    + bulkBarHTML();
}

// ── multi-select ──────────────────────────────────────────────────────────
// Clearing a queue one card at a time doesn't scale past a few dozen rows,
// and these arrive in the hundreds.
const selected = new Set();

/// Which rows this tab currently shows.
///
/// ── WHY FULLY-REACHED CANDIDATES ARE HIDDEN, NOT DELETED ──
/// An approved AI candidate that has reached every active device looks
/// finished, and it is — but the ROW is still doing a job. `pullApprovals`
/// re-reads every non-pending candidate on each sync with no "since" filter
/// and copies it into that device's local index. The table is the source a
/// device pulls FROM, not a delivery receipt.
///
/// "100%" also means 100% of devices seen in the last SEVEN DAYS, which is
/// what `moderation_candidate_reach` counts. It does not include a phone
/// that's been off for a fortnight, and it cannot include an install that
/// doesn't exist yet — every future user gets this food by pulling this row.
/// Delete it and it is gone for all of them.
///
/// So the queue hides them and the data stays.
function visibleRows() {
  if (currentTab !== "moderation_ai_candidates" || !hideSettled) return rows;
  return rows.filter((r) => {
    if (r.approval_status !== "approved") return true;
    const s = reachById[r.id];
    return !(s && s.active_devices > 0 && s.reached_devices >= s.active_devices);
  });
}
let hideSettled = true;

window.toggleSettled = () => { hideSettled = !hideSettled; render(); };

function selectBarHTML(shown, hidden) {
  const all = shown.length && shown.every((r) => selected.has(String(r.id)));
  return `<div class="selbar">`
    + `<button onclick="selectAll(${all ? "false" : "true"})">`
    + `${all ? "Clear selection" : `Select all ${shown.length}`}</button>`
    + (currentTab === "moderation_ai_candidates"
        ? `<button onclick="toggleSettled()">`
          + `${hideSettled ? "Show" : "Hide"} fully-reached</button>`
          + (hidden ? `<span>${hidden} settled and hidden</span>` : "")
        : "")
    + `</div>`;
}

function bulkBarHTML() {
  if (!selected.size) return "";
  // verified_foods has no status column — a row there is either right or it
  // is a bad record. Offering Approve would write a column that isn't there.
  const hasStatus = currentTab !== "verified_foods";
  return `<div class="bulk"><span class="n">${selected.size} selected</span>`
    + (hasStatus
        ? `<button class="approve" onclick="bulk('approved')">✓ Approve</button>`
          + `<button class="reject" onclick="bulk('rejected')">✗ Reject</button>`
        : "")
    + `<button class="reject" onclick="bulkDelete()">🗑 Delete</button>`
    + `<button class="clear" onclick="selectAll(false)">Clear</button></div>`;
}

window.togglePick = (id) => {
  const key = String(id);
  if (selected.has(key)) selected.delete(key); else selected.add(key);
  render();
};

window.selectAll = (on) => {
  selected.clear();
  if (on) for (const r of visibleRows()) selected.add(String(r.id));
  render();
};

/// Bulk status change.
///
/// Deliberately does NOT gather field edits the way `setStatus` does. Bulk is
/// for rows you have judged as they stand; sweeping up whatever happens to be
/// typed into a card you didn't mean to include is how a batch action becomes
/// something you can't undo. Edit-then-approve stays a per-card action.
window.bulk = async (status) => {
  const ids = [...selected];
  if (!ids.length) return;
  if (!confirm(`Mark ${ids.length} row${ids.length === 1 ? "" : "s"} ${status}?`)) return;
  const statusCol = currentTab === "moderation_ai_candidates"
    ? "approval_status" : "status";
  const { error } = await sb.from(currentTab)
    .update({ [statusCol]: status }).in("id", ids);
  if (error) { alert(error.message); return; }
  if (currentTab === "moderation_submissions" && status === "approved") {
    const failures = [];
    for (const id of ids) {
      const problem = await promote(id);
      if (problem) {
        const r = rows.find((x) => String(x.id) === String(id));
        failures.push(`${r ? r.food_name : id}: ${problem}`);
      }
    }
    if (failures.length) {
      alert(`Approved ${ids.length}, but ${failures.length} were NOT added `
            + `to the shared database:\n\n${failures.join("\n")}`);
    }
  }
  selected.clear();
  load();
};

window.bulkDelete = async () => {
  const ids = [...selected];
  if (!ids.length) return;
  if (!confirm(`Delete ${ids.length} row${ids.length === 1 ? "" : "s"} permanently?`
               + "\n\nThis cannot be undone.")) return;
  const { error } = await sb.from(currentTab).delete().in("id", ids);
  if (error) { alert(error.message); return; }
  selected.clear();
  load();
};

function tabNote() {
  if (currentTab === "moderation_ai_candidates") {
    return `<p class="note">Sorted by confidence, highest first — but
      confidence predicts approval poorly (33–44% error at every threshold
      tested), so it orders your time rather than deciding anything.<br><br>
      <strong>Reach</strong> = devices seen in the last <strong>7 days</strong>
      that have pulled this approval. 100% does <strong>not</strong> mean the
      row is finished with: every sync re-reads the whole approved set, so this
      row is what a phone that's been off for a fortnight — and every install
      that doesn't exist yet — will pull the food from. Deleting it takes the
      food away from all of them. Fully-reached rows are hidden from this queue
      instead, which is what "settled" means above.</p>`;
  }
  if (currentTab === "verified_foods") {
    return `<p class="note">These are the app's highest-trust records — a
      barcode scan believes this table over every other source. You can correct
      the <strong>name, brand and serving size</strong>: the things a
      crowd-sourced database gets wrong and a label photo can't capture. The
      nutrition is read-only on purpose — it came off a photographed label
      through the verified-read flow, which exists so those numbers are never
      typed by hand. If they're wrong, the record is wrong: 🗑 it and the next
      scan of that barcode re-verifies from the label.</p>`;
  }
  return `<p class="note">Edit any field, then approve — edits save with the
    approval and flow back into Caterpillar. 🗑 removes a row permanently.</p>`;
}

function reachCell(r) {
  const stats = reachById[r.id];
  if (!stats || stats.active_devices === 0) return "0/0";
  const pct = Math.round(100 * stats.reached_devices / stats.active_devices);
  return `${stats.reached_devices}/${stats.active_devices} (${pct}%)`;
}

// ── writes ────────────────────────────────────────────────────────────────

/// Put an approved correction into the shared database.
///
/// ── APPROVE USED TO STOP AT THE STATUS COLUMN ──
/// Approving a correction set `status = 'approved'` and nothing else, so no
/// approved correction ever reached verified_foods — 35 of them by 29 Sep.
/// The verified-foods function's `promote` task does the copy; it checks this
/// session belongs to the moderator, because the table takes no client writes.
///
/// Returns a line to show when it could not promote, or null on success.
async function promote(id) {
  const { data, error } = await sb.functions.invoke("verified-foods", {
    body: { task: "promote", submissionId: id },
  });
  if (error) return `couldn't reach the database: ${error.message}`;
  if (!data || data.promoted !== true) {
    return data && data.reason ? data.reason : "not promoted";
  }
  return null;
}

window.setStatus = async (id, status) => {
  const row = rows.find((r) => String(r.id) === String(id));
  // Undo the display conversion: what's on screen may be per-serving, but
  // per-100 g is what the app stores and what every reader expects.
  const f = row ? displayFactor(row) : 1;
  const patch = {};
  document.querySelectorAll(`input[data-id="${CSS.escape(String(id))}"]`).forEach((i) => {
    const col = i.dataset.col;
    const raw = i.value.trim();
    // Untouched field: leave the stored value exactly as it is.
    if (raw === (i.dataset.orig ?? "")) return;
    if (raw === "") {
      // Numeric blanks become NULL; blank text is skipped so we never wipe it.
      if (numericCols.has(col)) patch[col] = null;
      return;
    }
    if (!numericCols.has(col)) { patch[col] = raw; return; }
    const n = Number(raw);
    if (Number.isNaN(n)) return;
    // serving_size is a real measurement, not a per-100 g value — it must
    // never be divided by the factor derived from itself.
    patch[col] = (i.dataset.factor && col !== "serving_size" && f !== 1)
      ? n / f : n;
  });
  const statusCol = currentTab === "moderation_ai_candidates"
    ? "approval_status" : "status";
  patch[statusCol] = status;
  const { error } = await sb.from(currentTab).update(patch).eq("id", id);
  if (error) { alert(error.message); return; }
  // Edits above are saved first, so what gets promoted is what's on screen.
  if (currentTab === "moderation_submissions" && status === "approved") {
    const problem = await promote(id);
    if (problem) {
      alert(`Approved, but NOT added to the shared database:\n${problem}`);
    }
  }
  load();
};

/// Save edits with no status change.
///
/// setStatus() exists for queues that get approved or rejected; verified_foods
/// has no status to set — a row is either right or it needs correcting. It
/// also stores values exactly as printed on the label, so unlike the
/// correction queues nothing here is divided by a per-100 g factor.
window.saveRow = async (id) => {
  const patch = {};
  // Micronutrient edits arrive as `micros.<id>` and have to be folded into
  // ONE jsonb object — patching `micros` twice in the same update would send
  // the second write only. Collected here, merged onto the row's existing
  // blob below, so correcting one key never drops the others.
  const microEdits = {};
  document.querySelectorAll(`input[data-id="${CSS.escape(String(id))}"]`).forEach((i) => {
    const col = i.dataset.col;
    const raw = i.value.trim();
    if (raw === (i.dataset.orig ?? "")) return;   // untouched
    if (col.startsWith("micros.")) {
      const key = col.slice("micros.".length);
      // Blank means "this row doesn't carry that nutrient", which is a
      // deletion from the blob rather than a zero — a stored 0 would claim
      // the label declared none.
      if (raw === "") { microEdits[key] = null; return; }
      const n = Number(raw);
      if (!Number.isNaN(n)) microEdits[key] = n;
      return;
    }
    if (raw === "") {
      if (numericCols.has(col)) patch[col] = null;
      return;
    }
    if (!numericCols.has(col)) { patch[col] = raw; return; }
    const n = Number(raw);
    if (!Number.isNaN(n)) patch[col] = n;
  });
  if (Object.keys(microEdits).length) {
    const row = rows.find((r) => String(r.id) === String(id));
    const merged = { ...(row && row.micros ? row.micros : {}) };
    for (const [k, v] of Object.entries(microEdits)) {
      if (v === null || !(v > 0)) delete merged[k];
      else merged[k] = v;
    }
    patch.micros = merged;
  }
  if (!Object.keys(patch).length) { alert("Nothing changed."); return; }
  // Renaming a flagged row IS the fix, so clear the flag in the same write.
  // Leaving it set would send the moderator back to a row they had already
  // dealt with, and the queue would never empty.
  if (currentTab === "verified_foods" && patch.product_name) {
    patch.name_review = false;
  }
  const { error } = await sb.from(currentTab).update(patch).eq("id", id);
  if (error) alert(error.message); else load();
};

window.deleteRow = async (id) => {
  if (!confirm("Delete this row permanently?")) return;
  const { error } = await sb.from(currentTab).delete().eq("id", id);
  if (error) alert(error.message); else load();
};

window.exportCSV = () => {
  if (!rows.length) return;
  // Photos are megabytes of base64 and unreadable in a spreadsheet.
  const cols = Object.keys(rows[0]).filter((c) =>
    !["photos_b64", "label_photo_b64"].includes(c));
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [cols.join(",")]
    .concat(rows.map((r) => cols.map((c) => q(r[c])).join(",")))
    .join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `caterpillar-${currentTab}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

const { data: { session } } = await sb.auth.getSession();
if (session) showApp();
</script>
</body>
</html>
