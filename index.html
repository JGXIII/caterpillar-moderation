<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Caterpillar Moderation</title>
<style>
  :root { --green:#2e7d32; --amber:#ffbf00; --bg:#0a1f0d; --card:#132b17; }
  * { box-sizing:border-box; font-family:-apple-system,system-ui,sans-serif; }
  body { margin:0; background:var(--bg); color:#eee; }
  header { padding:14px 20px; background:var(--card); display:flex;
           align-items:center; gap:12px; }
  header h1 { font-size:17px; margin:0; color:#9ccc65; flex:1; }
  main { padding:16px; max-width:1200px; margin:0 auto; }
  .tabs button { background:none; border:1px solid #345; color:#bbb;
    padding:7px 14px; border-radius:16px; margin-right:6px; cursor:pointer; }
  .tabs button.active { background:var(--green); color:#fff; border-color:var(--green); }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }
  th, td { padding:7px 8px; border-bottom:1px solid #234; text-align:left; }
  th { color:#9ccc65; font-size:11px; text-transform:uppercase; }
  td input { width:64px; background:#0e2412; border:1px solid #345;
             color:#fff; border-radius:6px; padding:4px; }
  td input.wide { width:150px; }
  .approve { background:var(--green); } .reject { background:#8b3a3a; }
  .del { background:#334; }
  .approve, .reject, .del { border:none; color:#fff; border-radius:8px;
                      padding:5px 10px; cursor:pointer; margin:1px; }
  .status-pending  { color:var(--amber); }
  .status-approved { color:#81c784; }
  .status-rejected { color:#e57373; }
  #login { max-width:340px; margin:120px auto; background:var(--card);
           padding:26px; border-radius:16px; }
  #login input { width:100%; margin:6px 0; padding:10px; border-radius:8px;
                 border:1px solid #345; background:#0e2412; color:#fff; }
  #login button { width:100%; padding:11px; margin-top:10px; border:none;
                  border-radius:8px; background:var(--green); color:#fff;
                  font-weight:700; cursor:pointer; }
  .pill { font-size:11px; padding:2px 8px; border-radius:10px;
          background:#234; }
  #msg { color:var(--amber); font-size:12px; }
  .csv { background:none; border:1px solid #567; color:#9ccc65;
         border-radius:8px; padding:6px 12px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>🐛 Caterpillar Moderation</h1>
  <span id="refreshed" class="pill"></span>
  <button class="csv" onclick="exportCSV()">Export CSV</button>
  <button class="csv" onclick="logout()" id="logoutBtn" style="display:none">Log out</button>
</header>

<div id="login">
  <h2 style="margin-top:0">Sign in</h2>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="login()">Sign in</button>
  <p id="msg"></p>
</div>

<main id="app" style="display:none">
  <div class="tabs">
    <button data-tab="verified_foods" class="active">Verified Foods</button>
    <button data-tab="moderation_ai_candidates">AI Candidates</button>
    <button data-tab="moderation_submissions">Submissions &amp; Corrections</button>
    <button data-tab="moderation_food_requests">Food Requests</button>
    <button data-tab="moderation_barcode_triage">Barcode Failures</button>
    <button data-tab="account_deletion_requests">Deletion Requests</button>
  </div>
  <div id="content"></div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://jkxxqojfualdmsvyaprz.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpreHhxb2pmdWFsZG1zdnlhcHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MDg2NDcsImV4cCI6MjA5MTk4NDY0N30.xN4-oo8YagLnrOjD0IhliEN_2GdYYTLhpQzHCkrVnU0";
const sb = createClient(SUPABASE_URL, ANON_KEY);

let currentTab = "verified_foods";
let rows = [];
let reachById = {};   // candidate_id -> { reached_devices, active_devices }

window.login = async () => {
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
  });
  document.getElementById("msg").textContent = error ? error.message : "";
  if (!error) showApp();
};
window.logout = async () => { await sb.auth.signOut(); location.reload(); };

async function showApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("logoutBtn").style.display = "inline-block";
  await load();
  setInterval(load, 60 * 1000);   // once a minute — it used to be hourly
}

document.querySelectorAll(".tabs button").forEach((b) =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((x) =>
      x.classList.remove("active"));
    b.classList.add("active");
    currentTab = b.dataset.tab;
    load();
  }));

// A second client using the ANON key. moderation_ai_candidates grants anon
// SELECT, so if anon can see rows the signed-in session cannot, that is
// definitively an RLS problem on the authenticated role — not an empty queue.
// This exists because that exact failure hid for two weeks behind a cheerful
// "Nothing pending" (the dashboard could not read ANY table from 19 July,
// while 64 candidates piled up).
const probe = createClient(SUPABASE_URL, ANON_KEY);

async function permissionsLookBroken() {
  try {
    const { count, error } = await probe
      .from("moderation_ai_candidates")
      .select("id", { count: "exact", head: true });
    if (error) return false;
    if (!count) return false;
    const { count: mine } = await sb
      .from("moderation_ai_candidates")
      .select("id", { count: "exact", head: true });
    return (mine ?? 0) === 0;
  } catch { return false; }
}

async function load() {
  // AI candidates sort by CONFIDENCE, highest first. Scored against 27 real
  // decisions, ai_confidence turned out not to predict approval well enough
  // to auto-approve on (33-44% error at every threshold from 0.6 to 0.9) —
  // but it's still the best available ordering, so review time goes to the
  // most likely keepers first. selection_count breaks ties: a candidate a
  // user actually picked is the strongest signal there is.
  let q = sb.from(currentTab).select("*");
  q = currentTab === "moderation_ai_candidates"
    ? q.order("ai_confidence", { ascending: false })
       .order("selection_count", { ascending: false })
    : q.order("created_at", { ascending: false });
  const { data, error } = await q.limit(500);
  if (error) { document.getElementById("content").textContent = error.message; return; }
  rows = data ?? [];

  // Reach: % of devices active in the last 7 days that have received each
  // approved item. Only meaningful for the AI Candidates tab.
  reachById = {};
  if (currentTab === "moderation_ai_candidates") {
    const { data: reach } = await sb.from("moderation_candidate_reach").select("*");
    for (const r of reach ?? []) reachById[r.candidate_id] = r;
  }

  document.getElementById("refreshed").textContent =
    `${rows.length} row${rows.length === 1 ? "" : "s"} · updated `
    + new Date().toLocaleTimeString();
  render();
}

const editable = ["calories", "protein", "carbs", "fat", "fibre",
                  "serving_size", "caffeine_mg", "name", "brand", "food_name"];

function render() {
  // Verified Foods is a READ-ONLY window on the crowd-built database:
  // label scans that passed the app's confidence + consistency checks are
  // auto-approved and land here (no review needed). It's where most of the
  // day-to-day activity actually is — the moderation tabs only fill when a
  // user submits a correction or an AI candidate needs a decision.
  const readOnly = currentTab === "verified_foods";
  if (!rows.length) {
    document.getElementById("content").innerHTML = readOnly
      ? "<p style='color:#9ccc65'>No verified foods yet — they appear as users scan nutrition labels.</p>"
      : "<p style='color:#9ccc65'>Nothing pending — go touch grass 🌿</p>";
    // …unless it isn't empty at all. Verify before believing it.
    permissionsLookBroken().then((broken) => {
      if (!broken || rows.length) return;
      document.getElementById("content").innerHTML =
        "<div style='background:#5a1d1d;border:1px solid #ff8a80;border-radius:10px;" +
        "padding:16px;color:#ffcdd2;max-width:720px'>" +
        "<strong>This dashboard cannot read the database.</strong><br><br>" +
        "The tables are NOT empty — an anonymous client can see rows that " +
        "your signed-in session cannot. That means the row-level security " +
        "policies for the <code>authenticated</code> role are missing or " +
        "wrong.<br><br>" +
        "A blocked SELECT returns an empty result rather than an error, which " +
        "is why this looks like an empty queue.<br><br>" +
        "Fix: re-apply <code>supabase/migrations/20260801_moderation_dashboard_read.sql</code> " +
        "with <code>supabase db push</code>.</div>";
    });
    return;
  }
  const cols = Object.keys(rows[0]).filter((c) =>
    !["label_photo_b64", "raw_response", "submitter_id"].includes(c));
  const showReach = currentTab === "moderation_ai_candidates";
  let html = "<table><tr>" + cols.map((c) => `<th>${c}</th>`).join("")
    + (showReach ? "<th>reach (7d)</th>" : "")
    + (readOnly ? "" : "<th>actions</th>") + "</tr>";
  for (const r of rows) {
    html += "<tr>" + cols.map((c) => {
      const v = r[c] ?? "";
      if (!readOnly && editable.includes(c)) {
        const wide = ["name", "brand", "food_name"].includes(c) ? "wide" : "";
        return `<td><input class="${wide}" data-id="${r.id}" data-col="${c}" value="${String(v).replace(/"/g, "&quot;")}"></td>`;
      }
      if (c.includes("trust")) return `<td class="status-${v}">${v}</td>`;
      if (c.includes("status")) return `<td class="status-${v}">${v}</td>`;
      return `<td>${typeof v === "string" && v.length > 40 ? v.slice(0, 40) + "…" : v}</td>`;
    }).join("");
    if (showReach) {
      html += `<td>${reachCell(r)}</td>`;
    }
    if (!readOnly) {
      html += `<td>
        <button class="approve" onclick="setStatus('${r.id}','approved')">✓</button>
        <button class="reject" onclick="setStatus('${r.id}','rejected')">✗</button>
        <button class="del" onclick="deleteRow('${r.id}')">🗑</button>
      </td>`;
    }
    html += "</tr>";
  }
  html += readOnly
    ? "</table><p style='color:#789;font-size:12px'>Read-only. These foods "
      + "were validated automatically from users' label scans (confidence "
      + "≥95, consistent macros). Trust rises Bronze → Silver → Gold as more "
      + "users confirm the same values; conflicting scans are flagged, never "
      + "auto-overwritten.</p>"
    : "</table><p style='color:#789;font-size:12px'>Edit any field, then "
      + "approve — edits save with the approval and flow back into Caterpillar. "
      + "🗑 removes a row permanently."
      + (showReach ? " \"Reach\" = devices active in the last 7 days that "
         + "have pulled this approval." : "") + "</p>";
  document.getElementById("content").innerHTML = html;
}

// "42/58 (72%)" for an approved item with reach data; "—" for anything not
// yet approved (0% would misleadingly read as "nobody wants this").
function reachCell(r) {
  if (r.approval_status !== "approved") return "—";
  const stats = reachById[r.id];
  if (!stats || stats.active_devices === 0) return "0/0";
  const pct = Math.round(100 * stats.reached_devices / stats.active_devices);
  return `${stats.reached_devices}/${stats.active_devices} (${pct}%)`;
}

// Numeric columns: an empty box must become NULL, never "" — Postgres
// rejects "" for a double precision column.
const numericCols = new Set(["calories", "protein", "carbs", "fat", "fibre",
  "serving_size", "caffeine_mg", "ai_confidence", "times_suggested",
  "selection_count", "request_count", "displayed_calories"]);

window.setStatus = async (id, status) => {
  const patch = {};
  document.querySelectorAll(`input[data-id="${id}"]`).forEach((i) => {
    const raw = i.value.trim();
    if (raw === "") {
      // Leave numeric blanks as NULL; skip blank text so we never wipe it
      if (numericCols.has(i.dataset.col)) patch[i.dataset.col] = null;
      return;
    }
    patch[i.dataset.col] = numericCols.has(i.dataset.col)
      ? Number(raw) : raw;
  });
  const statusCol = currentTab === "moderation_ai_candidates"
    ? "approval_status" : "status";
  patch[statusCol] = status;
  const { error } = await sb.from(currentTab).update(patch).eq("id", id);
  if (error) alert(error.message); else load();
};

window.deleteRow = async (id) => {
  if (!confirm("Delete this row permanently?")) return;
  const { error } = await sb.from(currentTab).delete().eq("id", id);
  if (error) alert(error.message); else load();
};

window.exportCSV = () => {
  if (!rows.length) return;
  const cols = Object.keys(rows[0]);
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [cols.join(",")]
    .concat(rows.map((r) => cols.map((c) => esc(r[c])).join(",")))
    .join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `caterpillar-${currentTab}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

// Restore session on reload
const { data: { session } } = await sb.auth.getSession();
if (session) showApp();
</script>
</body>
</html>
